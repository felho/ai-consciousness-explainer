    level: 2
    kind: claim
    section: "07"
    label: >-
      The same universality argument that explains brain-network functional
      convergence predicts that deep learning systems facing similar problems
      and optimization pressures converge on something functionally analogous
      to whatever consciousness does for us.
    anchors:
      - section: "07"
        quote: "The same universality argument that explains functional convergence between brains and neural networks gives us good reason to expect that deep learning systems, facing similar problems and optimization pressures, will converge on something functionally analogous to whatever consciousness does for us."
    interpolated: false

