  # ----------------------------------------------------- section 06 (06a) --
  # R2 STRESS PROTOCOL, the pre-registered prime suspect. Candidate single
  # label: "valences like pain are motivational backstops that inner-align
  # learning agents, AND the felt realness of qualia is a label applied by the
  # brain's reality monitor."
  #   1 split trigger  -> TWO. Cut at the "and": each half stands alone and
  #     each is separately defended (Gwern's backstop, mesa-optimization,
  #     the principal-agent framing vs. the reality monitor, inner speech,
  #     mental imagery, schizophrenia, the simulation argument). Neither half
  #     merely qualifies or colors the other.
  #   2 edge test      -> TWO. Remove the candidate key node and the sub-nodes
  #     fall into two near-disjoint components, one per half; the only link is
  #     s06a-form-and-content, which is the announcement that both halves are
  #     owed - a bridge between two chunks, not evidence for one claim.
  #   3 card test      -> TWO. "Why does pain hurt?" and "why do qualia feel
  #     real?" cannot honestly share one question and one answer.
  # Verdict 3:0, TWO claims -> plan B: the section is mapped as virtual chunks
  # 06a and 06b, each with its own key sentence. Recorded as a quality finding
  # about the text: one typographic section, two chunks for the reader.
  - id: s06a-key
    level: 1
    kind: claim
    section: "06a"
    label: >-
      Pain hurts because valence is an evolutionary backstop that keeps an
      agent capable of subverting its own objectives inner-aligned, and
      reinforcement learning may inner-align AI agents the same way.
    anchors:
      - section: "06"
        quote: "A related function of consciousness answers the question"
      - section: "06"
        quote: "valences like pain serve as an evolutionary backstop to reinforcement learning: a motivational guarantor that prevents agents from learning to ignore their higher-order policy objectives"
      - section: "06"
        quote: "The painfulness of pain is in a sense the solution to a principal-agent problem within the mind."
    interpolated: false

  - id: s06a-ast-separates-valence
    level: 2
    kind: qualification
    section: "06a"
    label: >-
      Attention Schema Theory treats valences like pain as separate from
      subjective experience itself, which is why emotions can go unnoticed and
      strong distraction can dull an injury.
    anchors:
      - section: "06"
        quote: "Attention Schema Theory treats valences like pain as separate from subjective experience per se."
      - section: "06"
        quote: "This is why we can have emotions we’re not immediately aware of, or lessen the pain from an injury with powerful distractions."
    interpolated: false

  - id: s06a-form-and-content
    level: 2
    kind: claim
    section: "06a"
    label: >-
      A theory of consciousness owes an account of both its form and its
      content: both that we have subjective experiences and why those
      experiences are vivid with meaning and realness.
    anchors:
      - section: "06"
        quote: "a theory of consciousness should account for both its form and content"
    interpolated: false

  - id: s06a-label-vs-feeling
    level: 2
    kind: ground
    section: "06a"
    label: >-
      A mere label saying this is bad can be subverted by a sufficiently clever
      optimizer, whereas a state that actually feels bad is harder to route
      around and doubles as a salient learning signal.
    anchors:
      - section: "06"
        quote: "can be subverted by a sufficiently clever optimizer"
      - section: "06"
        quote: "is both harder to route around and a"
    interpolated: false

  - id: s06a-simple-models-need-no-backstop
    level: 2
    kind: ground
    section: "06a"
    label: >-
      Simple models trained by gradient descent face an external optimizer they
      have no way to subvert, so their loss function does not need to be
      self-enforcing.
    anchors:
      - section: "06"
        quote: "Simple machine learning models trained by gradient descent face an external optimizer."
      - section: "06"
        quote: "The loss function does not need to be self-enforcing because the model has no way to subvert it."
    interpolated: false

  - id: s06a-mesa-optimization
    level: 2
    kind: claim
    section: "06a"
    label: >-
      Generalist, goal-pursuing agents that learn in-context are themselves
      optimizers and thus capable of mesa-optimization, so the external
      optimizer needs some mechanism to enforce inner alignment.
    anchors:
      - section: "06"
        quote: "But generalist, goal-pursuing agents that learn in-context are themselves optimizers and thus capable of"
      - section: "06"
        quote: "The external optimizer (be it evolution or gradient descent) needs some mechanism to enforce inner-alignment."
    interpolated: false

  - id: s06a-ai-valence
    level: 2
    kind: implication
    section: "06a"
    label: >-
      Evolution found valences like pain, pleasure and emotion to be the most
      efficient solution to inner alignment, so given universality valences may
      be how reinforcement learning inner-aligns AI agents too.
    anchors:
      - section: "06"
        quote: "Biological evolution found valences like pain, pleasure and emotion to be the most efficient solution to this class of problem."
      - section: "06"
        quote: "Given universality,"
    interpolated: false

  # ----------------------------------------------------- section 06 (06b) --
  - id: s06b-key
    level: 1
    kind: claim
    section: "06b"
    label: >-
      Qualia feel vividly real because the brain's reality monitor labels them
      as ground truth, which makes conscious content virtual and therefore
      substrate-independent.
    anchors:
      - section: "06"
        quote: "the qualitative aspects of experience carry the added sensation of"
      - section: "06"
        quote: "feel as real as anything because the brain’s"
      - section: "06"
        quote: "The virtual nature of qualia also points to their substrate independence."
    interpolated: false

  - id: s06b-hard-problem
    level: 2
    kind: implication
    section: "06b"
    label: >-
      This account of valence does not resolve the hard problem of
      consciousness, but it explains why the problem seems so hard in the first
      place.
    anchors:
      - section: "06"
        quote: "This account of valence does not necessarily resolve the “hard problem” of consciousness, but it does help explain why it seems so hard in the first place"
    interpolated: false

  - id: s06b-inner-voice
    level: 2
    kind: ground
    section: "06b"
    label: >-
      The voice in one's head lacks the full qualia of an actual voice however
      loud it gets, and a vividly imagined red apple lacks the grounded quality
      of actually seeing one.
    anchors:
      - section: "06"
        quote: "lacks the full qualia of an actual voice"
      - section: "06"
        quote: "it lacks the grounded quality of an actual visual experience"
    interpolated: false

  - id: s06b-schizophrenia
    level: 2
    kind: ground
    section: "06b"
    label: >-
      A leading theory of schizophrenia relates auditory and visual
      hallucinations to impairment of the brain's reality monitor, so the
      sufferer's hard problem is overcoming the realness of misapprehensions.
    anchors:
      - section: "06"
        quote: "relates auditory and visual hallucinations to impairments in the brain’s reality monitor"
      - section: "06"
        quote: "lies in overcoming the realness of their misapprehensions"
    interpolated: false

  - id: s06b-phantom-limb
    level: 2
    kind: ground
    section: "06b"
    label: >-
      The mind is software to the brain's hardware, and the indisputable
      feeling of occupying a physical place comes from body and attention
      schemas coupled to sensory input - as real as a phantom limb.
    anchors:
      - section: "06"
        quote: "The mind is software to the brain’s hardware"
      - section: "06"
        quote: "creates the indisputable feeling of physical presence"
    interpolated: false

  - id: s06b-simulation
    level: 2
    kind: claim
    section: "06b"
    label: >-
      Since the fundamental world of quantum fields has no colour, taste or
      loneliness, we are trapped in the brain's own world simulation - so
      neither brains nor computers are conscious, only simulations are.
    anchors:
      - section: "06"
        quote: "We are inescapably trapped within our brains’ own world simulation"
      - section: "06"
        quote: "Simulated water may not be wet, but water’s wetness is only ever simulated."
    interpolated: false

  - id: s06b-psychedelics
    level: 2
    kind: qualification
    section: "06b"
    label: >-
      The conclusion that experience is a simulation is admittedly much easier
      to accept after psychedelics decompose sensory experience into its
      geometric components.
    anchors:
      - section: "06"
        footnote: 8
        quote: "this conclusion is much easier to accept after consuming psychedelics that decompose sensory experiences into their geometric components"
    interpolated: false

