    level: 2
    kind: claim
    section: "07"
    label: >-
      A non-conscious golem-like AI is imaginable: superhuman at any given
      skill yet unable to acquire new ones in context, permanently on autopilot
      like a blindsighted creature of habit.
    anchors:
      - section: "07"
        quote: "I can even imagine a non-conscious, golem-like AI that is superhuman at any given skill but which lacks the ability to acquire"
      - section: "07"
        quote: "Such an AI would be on permanent autopilot; a"
