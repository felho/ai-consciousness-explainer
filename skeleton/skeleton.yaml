    level: 1
    kind: claim
    section: "07"
    label: >-
      Given naturalistic priors, some form of subjective experience in modern
      AI agents can no longer be ruled out - though most kinds of AI, lacking
      the post-training that would elicit it, are unambiguously not conscious.
    anchors:
      - section: "07"
        quote: "given my naturalistic priors"
      - section: "07"
        quote: "I can no longer rule out modern AI agents having some form of subjective experience"
      - section: "07"
        quote: "then most kinds of AI are unambiguously"
    interpolated: false

  - id: s07-method
    level: 2
    kind: claim
    section: "07"
    label: >-
      The case is built from brain-AI parallels, the likely function of
      consciousness and the training conditions that would re-develop it, and
      deliberately skips direct tests, which without a baseline of functional
      plausibility are dismissed as mimicry.
    anchors:
      - section: "07"
        quote: "My argument has mostly rested on drawing parallels between brains and AIs, unpacking consciousness’s likely function, and inferring the training conditions under which it might re-develop."
      - section: "07"
        quote: "I’ve otherwise ignored direct tests for consciousness in AI systems, because without establishing some baseline of functional plausibility, these are easily dismissed as merely"
