    kind: claim
    section: "07"
    label: >-
      A single forward pass may generate phenomenological content that is too
      fleeting, fragmentary and stateless to cohere into genuine experience, or
      that lacks any responsible individuated subject for whom it exists.
    anchors:
      - section: "07"
        quote: "in a way that is too fleeting, fragmentary and stateless to cohere into a genuine subjective experience"
      - section: "07"
        quote: "for the lack of a responsible, individuated “subject” for whom the contents are"
    interpolated: false

