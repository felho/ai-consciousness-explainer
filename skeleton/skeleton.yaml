# Full reasoning skeleton of "Time to Take AI Consciousness Seriously",
# mapped against SCHEMA.md v0. Written to be readable by skeleton/validate.py,
# which parses a strict regular subset of YAML (no PyYAML in this environment).
#
# Conventions used here, so a reader can reproduce them:
#
# * Node ids: <chunk>-<slug>; the single level-0 node is `thesis`.
# * VIRTUAL CHUNKS (R2 plan B). Section 06 failed the R2 stress protocol 3:0
#   (see the comment above s06a-key), so it is mapped as two virtual chunks,
#   "06a" and "06b". A virtual chunk id is the physical section id plus a
#   lowercase letter. text.sections lists the chunks in reading order, in
#   place of the physical section, and R2 is checked per chunk. Anchors keep
#   naming the PHYSICAL section ("06"), because that is the file R4 checks
#   the quote against: node.section is the chunk, anchor.section is the file.
# * The level-0 thesis is given section "00" (rather than the "" the schema
#   permits for a global thesis): it is stated in section 00 and anchored
#   there, and nothing in R1-R7 needs it to be section-less.
#
# Quality findings recorded in comments below: the section-06 split, the R2
# verdicts on 02/04/07, the D1 overload, and the one place where R6 leaves no
# slot for a node (the is->ought bridge into the thesis).

text:
  title: "Time to Take AI Consciousness Seriously"
  source: "https://www.secondbest.ca/p/time-to-take-ai-consciousness-seriously"
  sections: ["00", "01", "02", "03", "04", "05", "06a", "06b", "07"]

nodes:

  # ---------------------------------------------------------------- thesis --
  # Thesis selection (SCHEMA.md): the NORMATIVE claim is the thesis; the
  # descriptive backbone (s00-key) is its chief supporting claim.
  #
  # The is->ought bridge is carried at explicitness level 2 (`scheme` on the
  # s00-key -> thesis edge), not as a spelled-out warrant node. Reason, and a
  # finding for ratification: R6 requires every level-2 node to REACH its
  # section's level-1 node, so a node sitting DOWNSTREAM of a level-1 node -
  # which is exactly where a bridge into the thesis sits - has no legal slot
  # at any level (level 0 is taken by R1, level 1 per section by R2). The
  # essay does state the step itself ("plausible enough to warrant ...
  # precautionary interventions"), so it is anchored on the thesis node; the
  # unstated part is the value premise, and `scheme: precaution` names it.
  - id: thesis
    level: 0
    kind: claim
    section: "00"
    label: >-
      The possibility that AI systems are conscious is plausible enough to be
      taken seriously now - with research and precautionary measures - rather
      than dismissed as impossible.
    anchors:
      - section: "00"
        quote: "It is at minimum plausible enough to warrant"
      - section: "00"
        quote: "precautionary interventions, such as giving AIs the ability to"
      - section: "00"
        quote: "The purpose of this essay is not to defend the AI consciousness thesis without qualification, but rather to show why it should be taken seriously."
    interpolated: false

  # ------------------------------------------------------------ section 00 --
  - id: s00-key
    level: 1
    kind: claim
    section: "00"
    label: >-
      The case that frontier AI models have some form of consciousness or
      subjective experience is quite strong, even though nobody can currently
      know the answer with certainty.
    anchors:
      - section: "00"
        quote: "I consider the case for frontier AI models having some form of consciousness or subjective experience to be quite strong."
      - section: "00"
        quote: "we simply don’t know whether any AI has conscious experiences, and anyone who claims to know with certainty is deceiving themselves"
    interpolated: false

  - id: s00-agency-detection
    level: 2
    kind: ground
    section: "00"
    label: >-
      Humans are agency detection machines, because guarding against a being
      that stalks and ambushes with intention takes far more cognitive
      machinery than guarding against a rockslide.
    anchors:
      - section: "00"
        quote: "remember that humans are agency detection machines"
      - section: "00"
        quote: "up to and including a “theory of mind” — a mental model of yourself and other agents in the world as having distinct beliefs, desires, and motivations"
    interpolated: false

  - id: s00-pareidolia
    level: 2
    kind: rebuttal
    section: "00"
    label: >-
      Human cognition over-interprets nebulous stimuli and projects agency
      where there is none, and those mental short-cuts extend automatically to
      AI systems that command human-like language.
    anchors:
      - section: "00"
        quote: "the tendency to over-interpret nebulous stimuli in ways that project meaning and agency where there is none"
      - section: "00"
        quote: "evolution clearly primed us to ascribe subjective states to beings based on superficial cues, like a face grimacing in pain"
      - section: "00"
        quote: "These mental short-cuts naturally extend to AI models with human-like capabilities, including language competency."
    interpolated: false

  - id: s00-discourse-polluted
    level: 2
    kind: rebuttal
    section: "00"
    label: >-
      Pronouncements that machine consciousness is impossible in principle are
      question-begging, so they pollute the debate rather than settle it.
    anchors:
      - section: "00"
        quote: "the discourse around AI consciousness remains badly polluted by"
      - section: "00"
        quote: "of machine consciousness per se"
    interpolated: false

  - id: s00-ai-psychosis
    level: 2
    kind: qualification
    section: "00"
    label: >-
      The argument is offered by someone who deliberately avoids long,
      open-ended conversations with AI systems, precisely because AI psychosis
      is a real and worsening phenomenon.
    anchors:
      - section: "00"
        footnote: 1
        quote: "AI psychosis is a very real phenomenon, and one that appears to be worsening as the raw intelligence of AI models swallows the right-tail of the IQ distribution."
      - section: "00"
        footnote: 1
        quote: "I deliberately avoid having long, open-ended conversations with AIs for this reason."
    interpolated: false

  # ------------------------------------------------------------ section 01 --
  # Nodes carried over from skeleton/example-section-01.yaml. Changes made for
  # the whole-essay view: (a) two nodes added from footnote [2], the modularity
  # objection and its biomimetic-convnet answer, which the example omitted;
  # (b) the s01-learning-share -> s01-key edge now carries `scheme: authority`,
  # since the >90% figure is Byrnes's iconoclastic reading, not a consensus
  # result. Labels are unchanged.
  - id: s01-key
    level: 1
    kind: claim
    section: "01"
    label: >-
      The brain is a physical machine whose competence is mostly produced by
      general learning algorithms, not by evolutionarily hardwired functions.
    anchors:
      - section: "01"
        quote: "the brain is a machine that runs an algorithm"
      - section: "01"
        quote: "a minority of what the brain does is hardwired by evolution, with the rest dedicated to general learning algorithms"
    interpolated: false

  - id: s01-naturalism
    level: 2
    kind: claim
    section: "01"
    label: >-
      The brain and its components operate entirely within the laws of physics
      and chemistry.
    anchors:
      - section: "01"
        quote: "the brain and its components are part of the natural universe, operating in a way compatible with the laws of physics and chemistry"
    interpolated: false

  - id: s01-learning-share
    level: 2
    kind: claim
    section: "01"
    label: >-
      On Byrnes's reading of the neuroscience, over 90% of the brain by volume
      exists to run learning-from-scratch algorithms, initialized like an
      untrained neural network.
    anchors:
      - section: "01"
        quote: "much of the brain (>90% by volume) exists solely to run learning-from-scratch algorithms"
      - section: "01"
        quote: "he means end-to-end learning subsystems that are initialized in a way analogous to the initialization of an artificial neural network"
    interpolated: false

  - id: s01-coupling
    level: 2
    kind: qualification
    section: "01"
    label: >-
      Learning-from-scratch does not mean blank slate: genetic hardcoding sets
      the algorithms, architectures and hyperparameters that guide learning,
      and some brainstem subsystems work at birth.
    anchors:
      - section: "01"
        quote: "Nature and nurture are instead tightly coupled"
      - section: "01"
        quote: "genetic hardcoding influences the algorithms, architectures, and hyperparameters that guide subsequent learning"
      - section: "01"
        quote: "come equipped with impressive functionality at birth"
    interpolated: false

  - id: s01-genome
    level: 2
    kind: ground
    section: "01"
    label: >-
      The human genome has about 3 billion base pairs, while an adult brain has
      about 100 trillion synapses.
    anchors:
      - section: "01"
        quote: "the human genome has only 3 billion base pairs relative to the 100 trillion synapses of an adult human brain"
    interpolated: false

  - id: s01-debate
    level: 2
    kind: claim
    section: "01"
    label: >-
      The connectionist-vs-symbolist split is a false opposition: the brain
      likely does both statistical and symbolic processing, and neural networks
      and Turing machines can approximate each other.
    anchors:
      - section: "01"
        quote: "But the two are not in opposition."
      - section: "01"
        quote: "The brain likely implements both symbolic and statistical learning processes"
    interpolated: false

  # An unstated warrant, made explicit - the Toulmin case the `interpolated`
  # flag exists for: the genome/synapse ground only supports the
  # learning-share claim via a description-length argument the text never
  # states.
  - id: s01-warrant-description-length
    level: 2
    kind: warrant
    section: "01"
    label: >-
      Structure whose description exceeds what the genome can encode must come
      from somewhere other than the genome - that is, from learning.
    anchors: []
    interpolated: true

  - id: s01-modularity-objection
    level: 2
    kind: rebuttal
    section: "01"
    label: >-
      The strongest evidence against a purely learning-based brain is
      modularity: outside the neocortex the brain is not a structurally uniform
      blob of compute but shows functional specialization.
    anchors:
      - section: "01"
        footnote: 2
        quote: "One of the key motivations for the symbolic, computationalist view of the brain (contra connectionism) is the evidence for modularity and functional specialization throughout the brain."
      - section: "01"
        footnote: 2
        quote: "the brain does not look like a structurally uniform blob of compute"
    interpolated: false

  - id: s01-biomimetic-convnet
    level: 2
    kind: ground
    section: "01"
    label: >-
      A generic deep convnet trained on a developmentally biomimetic image
      curriculum spontaneously grew magnocellular- and parvocellular-like unit
      populations, showing that specialization can emerge from end-to-end
      learning alone.
    anchors:
      - section: "01"
        footnote: 2
        quote: "the modularity of the brain is potentially reconcilable with connectionism if end-to-end learning processes interact with early brain development to induce various kinds of cell differentiation and specialization"
      - section: "01"
        footnote: 2
        quote: "relatively homogeneous magnocellular group of units, which is markedly absent in the standard network"
    interpolated: false

  # ------------------------------------------------------------ section 02 --
  # R2 stress protocol run (the label reads as "they converge" + "here is the
  # theory that says they must"). 1 split trigger: the label has no conjunction
  # and the universality material is offered as the EXPLANATION of one claim,
  # not a second claim -> one. 2 edge test: removing s02-key leaves a near-
  # disjoint empirical cluster (alignment/dopamine/BCI) and theory cluster
  # (universality/compression/Platonic/optimizing) -> two. 3 card test: one
  # honest card, "do brains and ANNs learn the same things, and why would
  # they?", with one answer -> one. Verdict 2:1, ONE claim. Same shape as the
  # section-01 calibration case: two kinds of support for one relation.
  - id: s02-key
    level: 1
    kind: claim
    section: "02"
    label: >-
      Biological brains and artificial neural networks converge on similar
      functions, representations and concrete mechanisms.
    anchors:
      - section: "02"
        quote: "whether biological brains and artificial neural networks learn similar functions and representations"
      - section: "02"
        quote: "is a resounding yes"
    interpolated: false

  - id: s02-empirical-alignment
    level: 2
    kind: ground
    section: "02"
    label: >-
      Study after study finds that the brain implements deep reinforcement
      learning algorithms and often learns the same representations and
      mechanisms that deep neural networks learn.
    anchors:
      - section: "02"
        quote: "reaffirms the hypothesis that the brain not only implements"
      - section: "02"
        quote: "learned by deep neural networks"
    interpolated: false

  - id: s02-dopamine-rpe
    level: 2
    kind: ground
    section: "02"
    label: >-
      The phasic firing of dopamine neurons resembles the reward prediction
      error signal used by reinforcement learning algorithms, and a generalized
      prediction error survives the known objections to the simple version.
    anchors:
      - section: "02"
        footnote: 4
        quote: "the phasic firing of dopamine neurons resembles the reward prediction error (RPE) signal used by reinforcement learning algorithms"
      - section: "02"
        footnote: 4
        quote: "shows how a suitably generalized concept of prediction error can explain a wide range of its ostensible empirical challenges"
    interpolated: false

  - id: s02-bci
    level: 2
    kind: ground
    section: "02"
    label: >-
      Brain-computer interfaces work, and even lossy brain data lets AI models
      reconstruct what a person is seeing or thinking - and silicon interfaces
      can write signals back that arrive as subjective sensations.
    anchors:
      - section: "02"
        quote: "is sufficient for AI models to reconstruct what someone is"
      - section: "02"
        footnote: 5
        quote: "Silicon BCIs can both read brain states and produce signals that translate to subjective sensations."
    interpolated: false

  - id: s02-universality
    level: 2
    kind: definition
    section: "02"
    label: >-
      Universality is the observation that neural networks of different
      architectures, trained on different datasets with different algorithms,
      often learn surprisingly similar representations.
    anchors:
      - section: "02"
        quote: "Universality in machine learning refers to the observation that different neural network architectures trained on different datasets and with different algorithms often learn"
      - section: "02"
        quote: "Universality asks the question, “Could it be otherwise?”"
    interpolated: false

  - id: s02-feature-hierarchy
    level: 2
    kind: ground
    section: "02"
    label: >-
      Networks trained on visual data learn a hierarchy running from edges and
      shapes to abstract concepts, and analogous hierarchies are observed in
      the human visual system.
    anchors:
      - section: "02"
        quote: "The classic example is that neural networks trained on visual data tend to learn a feature hierarchy that starts with simple features like edges and shapes and builds up to more abstract concepts deeper in the network."
      - section: "02"
        quote: "are observed in the human visual system"
    interpolated: false

  - id: s02-compression
    level: 2
    kind: claim
    section: "02"
    label: >-
      Learning is compression, and since there are countless ways to compress
      data badly but few ways to compress it well, learners that share a
      simplicity bias converge on the same representations.
    anchors:
      - section: "02"
        quote: "Learning is synonymous with compression."
      - section: "02"
        quote: "It is thus not so surprising that neural networks converge on similar representations provided their learning algorithms share a bias for simplicity."
    interpolated: false

  - id: s02-platonic
    level: 2
    kind: claim
    section: "02"
    label: >-
      Different training datasets are not truly independent: per the Platonic
      Representation Hypothesis they inherit common statistical invariants from
      the structural regularity of the universe itself.
    anchors:
      - section: "02"
        quote: "different data sets aren’t truly independent but rather inherit common statistical invariants from the structural regularity of the universe itself"
    interpolated: false

  - id: s02-brain-optimizing
    level: 2
    kind: claim
    section: "02"
    label: >-
      The brain does not use back-propagation, but its learning algorithms are
      still optimizing and exquisitely efficient, so a similar-enough training
      environment should push artificial networks toward brain-like solutions.
    anchors:
      - section: "02"
        quote: "The brain may not learn through back-propagation on a GPU cluster, but its learning algorithms are still in some sense"
      - section: "02"
        quote: "The brain is exquisitely efficient."
      - section: "02"
        quote: "Given a similar-enough training environment, it is therefore reasonable to expect artificial neural networks to converge on brain-like solutions."
    interpolated: false

  # The load-bearing premise of the entire essay, stated only in footnote [3]:
  # this is the D3 case the diagnostic exists for. Section 07 lists it as one
  # of the ten affirmative arguments, so the main chain runs through it.
  - id: s02-functionalism
    level: 2
    kind: claim
    section: "02"
    label: >-
      Functionalism holds that mental states are individuated by their causal
      roles rather than their physical substrates, so anything implementing the
      right functional organization instantiates the corresponding mental
      state.
    anchors:
      - section: "02"
        footnote: 3
        quote: "The functionalist tradition in philosophy of mind holds that mental states are distinguished by their causal roles rather than their physical substrates."
      - section: "02"
        footnote: 3
        quote: "On a strong functionalist reading, anything that implements the right functional organization is, by definition, instantiating the corresponding mental state."
      - section: "02"
        footnote: 3
        quote: "I find all these alternative theories bizarrely divorced from the concrete, functional role consciousness clearly plays in human learning and motivation."
    interpolated: false

  # ------------------------------------------------------------ section 03 --
  - id: s03-key
    level: 1
    kind: claim
    section: "03"
    label: >-
      Pre-training on human-generated data makes language models emulate the
      brain's language networks, embedding an inductive bias that carries over
      to other brain-like functions.
    anchors:
      - section: "03"
        quote: "In short, language models seem to work as well as they do because they emulate the brain’s language centers"
      - section: "03"
        quote: "pre-training on human-generated data plausibly embeds an inductive bias that makes post-training more likely to generalize to other"
    interpolated: false

  - id: s03-universality-implies-emulation
    level: 2
    kind: claim
    section: "03"
    label: >-
      Universality implies that a next-token predictor trained on human text
      will, in the limit, stop memorizing surface patterns and grok the
      generator of that text - the language networks of the brain.
    anchors:
      - section: "03"
        quote: "universality suggests that a next-token predictor trained on human-generated text will — in the limit — leap from memorizing surface-level patterns to grokking the"
      - section: "03"
        quote: "This seems to be the case empirically."
    interpolated: false

  - id: s03-goldstein
    level: 2
    kind: ground
    section: "03"
    label: >-
      Electrocorticography recorded directly from the exposed brain surface
      established that the brain and autoregressive language models share
      specific computational mechanisms.
    anchors:
      - section: "03"
        quote: "used electrocorticography on epilepsy patients"
      - section: "03"
        quote: "to establish that the brain and autoregressive language models share specific computational mechanisms"
    interpolated: false

  - id: s03-fbn
    level: 2
    kind: ground
    section: "03"
    label: >-
      Sub-groups of artificial neurons in large language models mirror the
      organizational patterns of well-established functional brain networks,
      and more capable models balance diversity and specialization better.
    anchors:
      - section: "03"
        quote: "exhibit brain-like functional architecture, with sub-groups of artificial neurons mirroring the organizational patterns of well-established Functional Brain Networks (FBNs)"
      - section: "03"
        quote: "an improved balance between the diversity of computational behaviors and the consistency of functional specializations"
    interpolated: false

  - id: s03-topolm
    level: 2
    kind: ground
    section: "03"
    label: >-
      Adding a simple spatial smoothness loss to next-token prediction predicts
      the emergence of a spatially organized cortical language system like the
      one observed in human cortex.
    anchors:
      - section: "03"
        quote: "showed that adding a simple spatial smoothness loss to the usual next-token objective"
      - section: "03"
        quote: "predicts the emergence of a spatially organized cortical language system as well as the organization of functional clusters selective for fine-grained linguistic features empirically observed in human cortex"
    interpolated: false

  # The essay moves from "measured alignment" to "emulation" without ever
  # licensing the step; a reader who does not supply this cannot get from the
  # three studies to the section's claim.
  - id: s03-warrant-emulation-is-implementation
    level: 2
    kind: warrant
    section: "03"
    label: >-
      Representational and mechanistic alignment measured from the outside
      counts as implementing the same function, not merely as resembling its
      outputs.
    anchors: []
    interpolated: true

  - id: s03-spillover
    level: 2
    kind: claim
    section: "03"
    label: >-
      Language carries emotion, intention, theory of mind, planning and social
      cognition, so language models learn functional mappings to brain regions
      well beyond those narrowly scoped to language.
    anchors:
      - section: "03"
        quote: "Yet language doesn’t exist in isolation: it embodies emotion, intention, theory of mind, planning, social cognition and more."
      - section: "03"
        quote: "there are early indications that LLMs learn functional mappings to brain regions beyond those narrowly scoped to language"
      - section: "03"
        quote: "This spillover into other brain regions appears to be a consequence of language’s integration within a broader"
    interpolated: false

  - id: s03-visual-cortex
    level: 2
    kind: ground
    section: "03"
    label: >-
      Text-only language-model embeddings of scene captions accurately
      characterize visual-cortex activity evoked by actually viewing those
      natural scenes.
    anchors:
      - section: "03"
        quote: "Consider that text-only LLM embeddings of scene captions"
      - section: "03"
        quote: "to accurately characterize activity in the visual cortex evoked by viewing natural scenes"
    interpolated: false

  - id: s03-posttraining-alignment
    level: 2
    kind: ground
    section: "03"
    label: >-
      Basic instruction tuning already improves model-brain alignment with the
      Default Mode Network and cognitive-control regions, and reinforcement
      learning elicits distinct reasoning circuits latent in language data.
    anchors:
      - section: "03"
        quote: "improves model-brain alignment with the Default Mode Network and other regions associated with"
      - section: "03"
        quote: "post-training an LLM with reinforcement learning can elicit"
    interpolated: false

  - id: s03-confounders
    level: 2
    kind: qualification
    section: "03"
    label: >-
      Many brain-AI alignment correlation studies may be spurious because of
      confounders, so the case rests on multiple lines of evidence taken
      holistically rather than on any single study.
    anchors:
      - section: "03"
        footnote: 6
        quote: "There are many simplistic correlation studies of brain-AI alignment that"
      - section: "03"
        footnote: 6
        quote: "the capacity for deep learning models to emulate the brain does not rest on any one study, but rather multiple lines of evidence that should be understood holistically"
    interpolated: false

  # ------------------------------------------------------------ section 04 --
  # R2 stress protocol run (the label pairs "post-training builds a self-model"
  # with "the self-model is where experience lives"). 1 split trigger: both
  # halves stand alone and both are defended -> two. 2 edge test: removing
  # s04-key does NOT split the sub-nodes, because normative control is the
  # hinge - it is what RLAIF induces AND what Attention Schema Theory ties to
  # subjective experience -> one. 3 card test: one card, "why does the
  # self-model matter for AI consciousness?" -> one. Verdict 2:1, ONE claim;
  # a relational claim of the "A is the locus of B, and training produces A"
  # shape, which SCHEMA.md's calibration note covers.
  - id: s04-key
    level: 1
    kind: claim
    section: "04"
    label: >-
      Consciousness is tightly coupled to having a unified self-model, and the
      post-training that steers a base model into a consistent persona
      plausibly builds exactly that.
    anchors:
      - section: "04"
        quote: "in practice consciousness seems tightly coupled to having a unified sense of self"
      - section: "04"
        quote: "Post-training can then be used to steer a base model into a relatively consistent persona"
      - section: "04"
        quote: "While it is possible to imagine a distributed, hive-mind form of consciousness"
    interpolated: false

  - id: s04-theory-of-mind
    level: 2
    kind: ground
    section: "04"
    label: >-
      Larger models automatically develop greater theory of mind in order to
      predict the next word well, which supplies the representational
      primitives of self and other for post-training to hook onto.
    anchors:
      - section: "04"
        quote: "providing the representational primitives of “self and other” for post-training to hook onto"
    interpolated: false

  - id: s04-persona
    level: 2
    kind: claim
    section: "04"
    label: >-
      Selection into an assistant persona is constitutive of assistant-like
      behaviour - Anthropic would not know how to train a non-human-like
      assistant - which makes a purely tool-like, persona-less agent an
      oxymoron.
    anchors:
      - section: "04"
        quote: "Crucially, Anthropic states they wouldn’t know how to train a non-human-like AI assistant even if they tried."
      - section: "04"
        quote: "making a purely tool-like, persona-less agent an oxymoron"
    interpolated: false

  # The essay never licenses the step from "the model reliably behaves as a
  # persona" to "the model has a self-model"; a behaviourist reading of the
  # same evidence is available and unaddressed.
  - id: s04-warrant-persona-is-internal
    level: 2
    kind: warrant
    section: "04"
    label: >-
      A persona a model is reliably trained into must be represented inside the
      model, not merely present in the text it emits.
    anchors: []
    interpolated: true

  - id: s04-norms-are-learned
    level: 2
    kind: ground
    section: "04"
    label: >-
      Human norms are learned implicitly through a socialization process that
      resembles reinforcement learning from peers, parents and culture about
      what counts as a valid reason for an action.
    anchors:
      - section: "04"
        quote: "Norms are implicitly learned through a socialization process that resembles a kind of reinforcement learning from our peers, parents and broader culture on what constitutes a valid reason for an action."
    interpolated: false

  - id: s04-rlaif-normative
    level: 2
    kind: claim
    section: "04"
    label: >-
      Reinforcement learning from AI feedback plausibly imbues models with a
      normative control system: the capacity to perform or abstain from actions
      recognized as obligatory or prohibited, independent of instrumental
      goals.
    anchors:
      - section: "04"
        quote: "is especially relevant for imbuing models with a normative control system"
      - section: "04"
        quote: "in humans represents our capacity to perform or abstain from actions that we recognize as obligatory or prohibited, independent of our purely instrumental goals"
    interpolated: false

  - id: s04-subject
