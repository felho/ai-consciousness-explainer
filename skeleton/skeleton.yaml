  # R2 stress protocol run (the label pairs "cannot rule it out" with "most AI
  # is unambiguously not conscious"). 1 split trigger -> ONE: the second half
  # is explicitly a scope limit on the first ("At the same time, if I am right
  # that RL post-training is required..."), i.e. a half that qualifies the
  # other, which SCHEMA.md says clears the label. 2 edge test -> TWO: the
  # affirmative cluster and the not-conscious cluster are near-disjoint.
  # 3 card test -> ONE: "so are AIs conscious or not?" is one honest question
  # with one honest answer. Verdict 2:1, ONE claim.
