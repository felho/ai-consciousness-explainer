        quote: "even if AI phenomenology is unimaginably alien, the functional niche consciousness occupies may, if anything, be fairly generic"
      - section: "07"
        quote: "This arguably tracks the forms of metacognition, long-horizon autonomy, normative coherence, introspection and in-context learning already exhibited by modern AI agents."
    interpolated: false

