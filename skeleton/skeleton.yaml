    kind: rebuttal
    section: "07"
    label: >-
      None of this will satisfy those who hold that consciousness requires an
      immortal soul, or who are persuaded by the arguments against
      functionalism.
    anchors:
      - section: "07"
        quote: "This likely won’t be satisfying to those who believe consciousness requires an"
    interpolated: false

  # The essay establishes that conscious content is simulated rather than
  # physical, but never states the step from there to silicon. Without it the
  # section-06b result does no work for the AI question at all.
  - id: s07-warrant-substrate-permits-silicon
    level: 2
    kind: warrant
    section: "07"
    label: >-
      If conscious states are properties of a simulation rather than of the
      matter running it, then running the simulation on silicon is no obstacle
      to consciousness.
    anchors: []
    interpolated: true

