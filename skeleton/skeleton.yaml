  # The ten-bullet recap at the top of the section is NOT mapped as new nodes:
  # it restates the level-1 claims of 01-06, so it is represented by the
  # `presupposes` edges from s07-key back to them. That list was used as the
  # cross-check that the level-1 layer covers the author's own summary.
