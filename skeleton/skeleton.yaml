    level: 2
    kind: claim
    section: "05"
    label: >-
      Transformer self-attention performs the equivalent of virtual weight
      updates within a context, so consciousness is compatible with an
      otherwise frozen network while full continual learning needs a
      complementary learning system.
    anchors:
