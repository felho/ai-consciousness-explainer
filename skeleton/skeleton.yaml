  # ------------------------------------------------------------ section 05 --
  - id: s05-key
    level: 1
    kind: claim
    section: "05"
    label: >-
      Consciousness functions as the supervisor of learning, and the same
      supervisory role appears in AI as process supervision over in-context
      learning.
    anchors:
      - section: "05"
        quote: "Consciousness seems particularly useful to our brain’s ongoing self-supervised learning process."
      - section: "05"
        quote: "developing an attention schema (and hence a capacity for subjective experience) may be essential for continual learning in AIs, too, if it’s not already present during in-context learning"
    interpolated: false

  - id: s05-bubble-of-nowness
    level: 2
    kind: ground
    section: "05"
    label: >-
      Human phenomenology occupies a bubble of nowness that binds thoughts and
      valence-laden perceptions into one coherent thread, and it is
      second-order: we can notice ourselves noticing.
    anchors:
      - section: "05"
        quote: "our phenomenology occupies a “bubble of nowness” that integrates our thoughts and valence-laden perceptions into a coherent, unified thread of experience"
      - section: "05"
        quote: "Consciousness also has a second-order quality, i.e. we can notice ourselves noticing things."
    interpolated: false

  - id: s05-coherence-operator
    level: 2
    kind: claim
    section: "05"
    label: >-
      Bach conjectures that consciousness is not merely related to a coherent
      self-model but is itself the coherence-inducing operator that underlies
      the capacity to learn at all.
    anchors:
      - section: "05"
        quote: "lead to Bach’s conjecture that consciousness isn’t merely related to a coherent self-model, but is itself the"
    interpolated: false

  - id: s05-learning-requires-consciousness
    level: 2
    kind: ground
    section: "05"
    label: >-
      We must be conscious to learn at all and are more conscious learning
      something new than exercising a mastered skill, as the novice driver
      attending every gear shift shows against the experienced one on autopilot.
    anchors:
      - section: "05"
        quote: "We need to be conscious to learn at all, and are more conscious when learning something new than when doing something we’ve already mastered."
      - section: "05"
        quote: "A novice driver is aware of every gear shift, mirror check, and brake input, while an experienced driver can drive across town as if on autopilot."
    interpolated: false

  - id: s05-attention-on-novelty
    level: 2
    kind: ground
    section: "05"
    label: >-
      Conscious attention falls on novelty, prediction errors and whatever has
      not yet been distilled into habit, and prefrontal activation drops once a
      skill has been learned and automatized.
    anchors:
      - section: "05"
        quote: "Our conscious attention tends to fall on novelty, prediction errors, and whatever our brain has not yet distilled into learned habits."
      - section: "05"
        quote: "after a skill has been learned and automatized"
    interpolated: false

  - id: s05-ast
    level: 2
    kind: definition
    section: "05"
    label: >-
      On Attention Schema Theory consciousness just is the brain's imperfect
      model of its own attention, delocalized across temporoparietal and
      superior-temporal regions responsible for social cognition.
    anchors:
      - section: "05"
        quote: "the brain’s imperfect model of its own attention"
      - section: "05"
        quote: "the attention schema that accounts for our subjective awareness is delocalized across regions of the"
    interpolated: false

  - id: s05-process-supervision
    level: 2
    kind: ground
    section: "05"
    label: >-
      AI training uses analogous techniques: process supervision applies
      fine-grained reward at each reasoning step rather than sparse reward on
      the output, and models judge and filter their own outputs.
    anchors:
      - section: "05"
        quote: "Analogous techniques are used to train reasoning models and AI agents."
      - section: "05"
        quote: "fine-grained reward signals can be applied at each reasoning step or token (process supervision) to greatly improve performance"
      - section: "05"
        quote: "LLMs are commonly used as a judge to rank and filter their own outputs and improve the signal from supervised fine-tuning"
    interpolated: false

