    level: 2
    kind: claim
    section: "07"
    label: >-
      What is genuinely hard to imagine is an unconscious AI as capable as
      humans at the very things for which consciousness is functionally
      load-bearing.
    anchors:
      - section: "07"
        quote: "What I find harder to imagine is an unconscious AI that is as capable as humans at doing things for which consciousness is functionally load-bearing."
    interpolated: false

